        - heading "What I am sharpening now" [level=2] [ref=e135]
        - paragraph [ref=e136]: 我现在把重心放在应用型 AI 产品、可验证的多智能体工作流、RAG 与评测，以及能真正交付的产品工程。下面这些方向，也是作品区里每个项目共同指向的能力。
      - generic [ref=e137]:
        - article [ref=e138]:
          - generic [ref=e141]: 01 / applied product
          - generic [ref=e142]:
            - heading "把 AI 做成可使用的产品" [level=3] [ref=e143]
            - paragraph [ref=e144]: 我更关心真实流程里的输入、边界、失败恢复和结果复用，而不是一次性演示。好的 AI 产品应该让用户知道它为什么这么做、哪里可信、哪里需要人来判断。
        - article [ref=e145]:
          - generic [ref=e148]: 02 / agent workflow
          - generic [ref=e149]:
            - heading "把多智能体编排做成可验收的系统" [level=3] [ref=e150]
            - paragraph [ref=e151]: 多智能体不只是“多个模型一起说话”，而是任务拆解、角色隔离、结构化输出、所有权边界和 review gate。每一步都应该能被追踪、复盘和替换。
        - article [ref=e152]:
