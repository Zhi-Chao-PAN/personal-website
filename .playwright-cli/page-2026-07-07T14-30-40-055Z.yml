        - text: "[ now / focus ]"
        - heading "What I am sharpening now" [level=2] [ref=f1e135]
        - paragraph [ref=f1e136]: 我现在把重心放在应用型 AI 产品、可验证的多智能体工作流、RAG 与评测，以及能真正交付的产品工程。下面这些方向，也是作品区里每个项目共同指向的能力。
      - generic [ref=f1e137]:
        - article [ref=f1e138]:
          - generic [ref=f1e141]: 01 / applied product
          - generic [ref=f1e142]:
            - heading "把 AI 做成可使用的产品" [level=3] [ref=f1e143]
            - paragraph [ref=f1e144]: 我更关心真实流程里的输入、边界、失败恢复和结果复用，而不是一次性演示。好的 AI 产品应该让用户知道它为什么这么做、哪里可信、哪里需要人来判断。
        - article [ref=f1e145]:
          - generic [ref=f1e148]: 02 / agent workflow
          - generic [ref=f1e149]:
            - heading "把多智能体编排做成可验收的系统" [level=3] [ref=f1e150]
            - paragraph [ref=f1e151]: 多智能体不只是“多个模型一起说话”，而是任务拆解、角色隔离、结构化输出、所有权边界和 review gate。每一步都应该能被追踪、复盘和替换。
        - article [ref=f1e152]:
          - generic [ref=f1e155]: 03 / rag & evaluation
          - generic [ref=f1e156]:
            - heading "用评测把直觉变成证据" [level=3] [ref=f1e157]
            - paragraph [ref=f1e158]: 从结构化 PDF 解析到模型对比，我在练习把质量问题具体化：固定变量、记录指标、保留失败样本，让改进不只停留在“感觉更好”。
        - article [ref=f1e159]:
          - generic [ref=f1e162]: 04 / product engineering
          - generic [ref=f1e163]:
            - heading "保持能交付、能维护、能继续迭代" [level=3] [ref=f1e164]
            - paragraph [ref=f1e165]: Next.js、TypeScript、Python、LangGraph 和本地自动化只是工具。真正重要的是把想法落到一个别人能打开、能理解、能继续使用的系统里。
